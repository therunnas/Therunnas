name: Profile Activity & Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/scripts/*.py"
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: read

# Shared with GitHub-Profile-3D-Contrib: both commit to the branch they run on.
concurrency:
  group: profile-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Commits go only to the branch this run was started on, and only to an
      # allowed one. A run on profile-v2 can never write to main.
      - name: Resolve push target
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Only branch runs may publish (ref type: $GITHUB_REF_TYPE)."
            exit 1
          fi

          case "$GITHUB_REF_NAME" in
            main|profile-v2) ;;
            *)
              echo "::error::Branch not allowed to publish."
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Metrics depend on what the token can see. Without the owner's token
      # the numbers would change silently, so the run stops instead.
      - name: Require profile token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then
            echo "::error::PROFILE_TOKEN is not set."
            exit 1
          fi

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: therunnas
          STAT_OUT: assets/cards/stats.svg
          STAT_MOBILE_OUT: assets/cards/stats-mobile.svg
          STREAK_OUT: assets/cards/streak.svg
          STREAK_MOBILE_OUT: assets/cards/streak-mobile.svg
          METRICS_OUT: assets/cards/metrics.json
        run: |
          mkdir -p assets/cards
          python .github/scripts/github_stats.py

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: therunnas
          OUT: assets/cards/activity-graph.svg
          OUT_MOBILE: assets/cards/activity-graph-mobile.svg
          METRICS_IN: assets/cards/metrics.json
          LANGUAGES_OUT: assets/cards/languages.json
          # Stored as a secret: the names are private, and secrets are masked
          # in logs. Comma-separated owner/name list.
          EXCLUDE_REPOS: ${{ secrets.PROFILE_EXCLUDE_REPOS }}
        run: |
          python .github/scripts/activity_graph.py

      # The 3D calendar shows the same language source as the activity graph.
      - name: Apply language source and hide private totals in 3D graphs
        env:
          LANGUAGES_IN: assets/cards/languages.json
          PROFILE_3D_DIR: profile-3d-contrib
        run: |
          python .github/scripts/profile_3d_languages.py

      - name: Check generated files
        run: |
          echo "=== GENERATED FILES ==="
          ls -lh assets/cards/

      - name: Commit updated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/cards/activity-graph.svg
          git add assets/cards/activity-graph-mobile.svg
          git add assets/cards/stats.svg
          git add assets/cards/stats-mobile.svg
          git add assets/cards/streak.svg
          git add assets/cards/streak-mobile.svg
          git add assets/cards/metrics.json
          git add assets/cards/languages.json
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile cards"

          # Same guard as the "Resolve push target" step, repeated so this
          # step is safe on its own. Never force-push.
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Only branch runs may publish (ref type: $GITHUB_REF_TYPE)."
            exit 1
          fi

          case "$GITHUB_REF_NAME" in
            main|profile-v2) ;;
            *)
              echo "::error::Branch not allowed to publish."
              exit 1
              ;;
          esac

          target="$GITHUB_REF_NAME"

          for attempt in 1 2 3; do
            if git pull --rebase origin "$target" && git push origin "HEAD:refs/heads/$target"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done

          echo "::error::Could not push after 3 attempts."
          exit 1
