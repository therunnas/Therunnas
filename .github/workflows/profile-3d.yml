name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with Profile Activity & Stats: both commit to main.
concurrency:
  group: profile-main-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3 (was @latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: therunnas

      # The action's donut counts last-year commits by each repository's
      # primary language. Replace it with the profile's single language
      # source (code size), written by Profile Activity & Stats.
      - name: Apply language source and hide private totals in 3D graphs
        env:
          LANGUAGES_IN: assets/cards/languages.json
          PROFILE_3D_DIR: profile-3d-contrib
        run: |
          python3 .github/scripts/profile_3d_languages.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the generated graphs, never the whole working tree.
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "generated profile 3d contribution graph"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "::error::Could not push after 3 attempts."
          exit 1
