name: Generate 3D Contribution (daily)

on:
  schedule:
    - cron: "0 3 * * *"   # todos os dias 03:00 UTC
  workflow_dispatch:      # permite rodar manualmente
  push:
    branches: [ main ]

permissions:
  contents: write   # garante permissão para commitar os SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D profile contribution
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          username: therunnas
          theme: "night-rainbow"   # mude se quiser outro tema

            - name: Auto commit generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contributions"
