name: GitHub-Profile-3D-Contrib

on:
  workflow_dispatch:       # vamos rodar manualmente pra testar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions (public only)
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # <-- só público
          USERNAME: therunnas                         # <-- força seu usuário

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "generated 3d contrib"
          git push
