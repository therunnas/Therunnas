<svg xmlns="http://www.w3.org/2000/svg" width="840" height="112" viewBox="0 0 840 112" role="img" aria-label="Secure, server-side auth, Access control in the database, Audit trail for critical changes, Exact values, money in cents, Incremental pull requests">
<title>Secure, server-side auth, Access control in the database, Audit trail for critical changes, Exact values, money in cents, Incremental pull requests</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ct{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.cs{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.cp{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#E6E6E6}
.cn{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.cl{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.cf{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8A8A8A}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#E6E6E6}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.gt{font:700 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.pt{font:700 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ps{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.at{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.as{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.ap{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#E6E6E6}
.al{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
@keyframes gd0{0%,0%{stroke:#2A2A2A;fill:#141414}4%,18%{stroke:#E6E6E6;fill:#232323}22%,100%{stroke:#2A2A2A;fill:#141414}}.gd0{animation:gd0 10s ease infinite}@keyframes gd1{0%,20%{stroke:#2A2A2A;fill:#141414}24%,38%{stroke:#E6E6E6;fill:#232323}42%,100%{stroke:#2A2A2A;fill:#141414}}.gd1{animation:gd1 10s ease infinite}@keyframes gd2{0%,40%{stroke:#2A2A2A;fill:#141414}44%,58%{stroke:#E6E6E6;fill:#232323}62%,100%{stroke:#2A2A2A;fill:#141414}}.gd2{animation:gd2 10s ease infinite}@keyframes gd3{0%,60%{stroke:#2A2A2A;fill:#141414}64%,78%{stroke:#E6E6E6;fill:#232323}82%,100%{stroke:#2A2A2A;fill:#141414}}.gd3{animation:gd3 10s ease infinite}@keyframes gd4{0%,80%{stroke:#2A2A2A;fill:#141414}84%,98%{stroke:#E6E6E6;fill:#232323}100%,100%{stroke:#2A2A2A;fill:#141414}}.gd4{animation:gd4 10s ease infinite}</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8A8A8A"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<g class="up" style="animation-delay:0.10s"><rect class="gd0" x="1.0" y="1" width="155.6" height="110" rx="14" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="78.8" y="44" text-anchor="middle">🔐</text><text class="gt" x="78.8" y="72" text-anchor="middle">Secure,</text><text class="gt" x="78.8" y="90" text-anchor="middle">server-side auth</text></g>
<g class="up" style="animation-delay:0.22s"><rect class="gd1" x="171.6" y="1" width="155.6" height="110" rx="14" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="249.4" y="44" text-anchor="middle">🛡️</text><text class="gt" x="249.4" y="72" text-anchor="middle">Access control</text><text class="gt" x="249.4" y="90" text-anchor="middle">in the database</text></g>
<g class="up" style="animation-delay:0.34s"><rect class="gd2" x="342.2" y="1" width="155.6" height="110" rx="14" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="420.0" y="44" text-anchor="middle">📋</text><text class="gt" x="420.0" y="72" text-anchor="middle">Audit trail for</text><text class="gt" x="420.0" y="90" text-anchor="middle">critical changes</text></g>
<g class="up" style="animation-delay:0.46s"><rect class="gd3" x="512.8" y="1" width="155.6" height="110" rx="14" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="590.6" y="44" text-anchor="middle">🪙</text><text class="gt" x="590.6" y="72" text-anchor="middle">Exact values,</text><text class="gt" x="590.6" y="90" text-anchor="middle">money in cents</text></g>
<g class="up" style="animation-delay:0.58s"><rect class="gd4" x="683.4" y="1" width="155.6" height="110" rx="14" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="761.2" y="44" text-anchor="middle">🔁</text><text class="gt" x="761.2" y="72" text-anchor="middle">Incremental</text><text class="gt" x="761.2" y="90" text-anchor="middle">pull requests</text></g>
</svg>
