<svg xmlns="http://www.w3.org/2000/svg" width="862" height="102" viewBox="0 0 862 102" role="img" aria-label="Internal systems (management &amp; finance tools), Full-stack web (Next.js · Prisma · Postgres), Automation (bots &amp; dev tooling)">
<title>Internal systems (management &amp; finance tools), Full-stack web (Next.js · Prisma · Postgres), Automation (bots &amp; dev tooling)</title>
<style>
