<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" role="img" aria-label="179 pull requests merged all repos, as of Oct 2026, 94 commits to public repositories, all time, 5 public repos of others with commits or merged PRs">
<title>179 pull requests merged all repos, as of Oct 2026, 94 commits to public repositories, all time, 5 public repos of others with commits or merged PRs</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ct{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.cs{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.cp{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#E6E6E6}
.cn{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.cl{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.cf{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8A8A8A}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#E6E6E6}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.gt{font:700 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.pt{font:700 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.ps{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.at{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F2F2}
.as{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A0A0A0}
.ap{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#E6E6E6}
.al{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFCFCF}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8A8A8A"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="418" height="268" rx="18" fill="#141414" stroke="#2A2A2A"/>
<clipPath id="cm"><rect x="1" y="1" width="418" height="268" rx="18"/></clipPath>
<g clip-path="url(#cm)"><g class="shine"><rect x="0" y="-20" width="150" height="310" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="418" height="268" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<g transform="translate(0,72)"><g class="up" style="animation-delay:0.15s"><text class="nn" x="105" y="0" text-anchor="middle">179</text></g><g class="up" style="animation-delay:0.35s"><text class="nl" x="105" y="30" text-anchor="middle">pull requests merged</text><text class="nl" x="105" y="49" text-anchor="middle">all repos, as of Oct 2026</text></g></g>
<g transform="translate(0,72)"><g class="up" style="animation-delay:0.30s"><text class="nn" x="315" y="0" text-anchor="middle">94</text></g><g class="up" style="animation-delay:0.50s"><text class="nl" x="315" y="30" text-anchor="middle">commits to public</text><text class="nl" x="315" y="49" text-anchor="middle">repositories, all time</text></g></g>
<g transform="translate(0,197)"><g class="up" style="animation-delay:0.45s"><text class="nn" x="210" y="0" text-anchor="middle">5</text></g><g class="up" style="animation-delay:0.65s"><text class="nl" x="210" y="30" text-anchor="middle">public repos of others</text><text class="nl" x="210" y="49" text-anchor="middle">with commits or merged PRs</text></g></g>
<line class="ln" x1="28" y1="135" x2="392" y2="135" stroke="#2A2A2A" pathLength="100"/>
</svg>
